            color: var(--text-light);

        }

        body {

            flex-direction: column;
            overflow: hidden;
        }

            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* Header */

            color: white;
            padding: 1rem;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        /* Navigation */
        nav {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--bg-light);
            overflow-x: auto;
            flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }

        nav button {
            flex: 1;
            min-width: 80px;
            padding: 0.75rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        nav button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        nav button:active {
            background-color: var(--bg-secondary);
        }

        /* Main Content */
        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab {
            display: none;
            padding: 1rem;
            animation: fadeIn 0.3s ease-in;
        }

        .tab.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Cards */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card.highlight {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(37, 99, 235, 0.05) 100%);
            border: 2px solid var(--primary);
        }

        .card.completed {
            opacity: 0.6;
        }

        /* Match Card */
        .match-card {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1rem;
            align-items: center;
        }

        .match-team {
            text-align: center;
        }

        .match-team-name {
            font-weight: 700;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .match-team-flag {
            font-size: 2rem;
            line-height: 1;
        }

        .match-center {
            text-align: center;
            border-left: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            padding: 0 1rem;
        }

        .match-time {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .match-location {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .match-countdown {
            font-size: 0.75rem;
            color: var(--primary);
            margin-top: 0.5rem;
            font-weight: 600;
        }

        .match-stage {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            margin-top: 0.5rem;
        }

            display: flex;
            gap: 0.5rem;
        }

        .search-input {

            padding: 0.75rem 1rem;

            border-radius: 0.5rem;
            background: var(--bg-light);
            color: var(--text-light);
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-button {
            padding: 0.75rem 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .search-button:active {
            background: var(--primary-dark);
        }

            gap: 0.5rem;
            margin-bottom: 1rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 0.5rem;

        }

            background: white;
            color: var(--primary);

        // ==================== Utility Functions ====================
        function getCurrentDate() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate());
        }

        function getMatchDateTime(dateStr, timeStr) {
            const [year, month, day] = dateStr.split('-');
            const [hours, minutes] = timeStr.split(':');
            return new Date(year, parseInt(month) - 1, day, hours, minutes);
        }

        function formatDate(date) {
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const dayOfWeek = days[date.getDay()];
            return `${month}/${day}(${dayOfWeek})`;
        }

        function formatTime(date) {
            return date.toLocaleString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function isMatchCompleted(match) {
            const matchDate = getMatchDateTime(match.date, match.time);
            const now = new Date();
            return matchDate < now;
        }

        function getCountdownText(match) {
            const matchDate = getMatchDateTime(match.date, match.time);
            const now = new Date();
            const diffMs = matchDate - now;

            if (diffMs < 0) return '試合終了';

            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            if (diffDays > 0) {
                return `あと ${diffDays}日 ${diffHours}時間`;
            } else if (diffHours > 0) {
                return `あと ${diffHours}時間`;
            } else {
                const diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                return `あと ${diffMinutes}分`;
            }
        }

        // ==================== Render Functions ====================
        function createMatchCard(match, showHighlight = false) {
            const matchDate = getMatchDateTime(match.date, match.time);
            const isCompleted = isMatchCompleted(match);
            const formattedDate = formatDate(matchDate);
            const formattedTime = formatTime(matchDate);
            const countdown = getCountdownText(match);

            const card = document.createElement('div');
            card.className = `card ${showHighlight ? 'highlight' : ''} ${isCompleted ? 'completed' : ''}`;
            
            card.innerHTML = `
                <div class="match-card">
                    <div class="match-team">
                        <div class="match-team-flag">${match.team1.split(' ')[0]}</div>
                        <div class="match-team-name">${match.team1.split(' ').slice(1).join(' ')}</div>
                    </div>
                    <div class="match-center">
                        <div class="match-time">${formattedDate}<br>${formattedTime}</div>
                        <div class="match-stage">${match.stage}</div>
                        ${!isCompleted ? `<div class="match-countdown">${countdown}</div>` : ''}
                        <div class="match-location">${match.location}</div>
                    </div>
                    <div class="match-team">
                        <div class="match-team-flag">${match.team2.split(' ')[0]}</div>
                        <div class="match-team-name">${match.team2.split(' ').slice(1).join(' ')}</div>
                    </div>
                </div>
            `;

            return card;
        }

        function renderNextMatch() {
            const container = document.getElementById('next-match-container');
            const now = new Date();
            const upcomingMatches = MATCHES.filter(m => {
                const matchDate = getMatchDateTime(m.date, m.time);
                return matchDate >= now;
            });

            if (upcomingMatches.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎉</div><p>全試合終了！</p></div>';
                return;
            }

            container.innerHTML = '';
            container.appendChild(createMatchCard(upcomingMatches[0], true));
        }

        function renderNextJapanMatch() {
            const container = document.getElementById('next-japan-match-container');
            const now = new Date();
            const japanMatches = MATCHES.filter(m => {
                const isJapanMatch = m.team1.includes('日本') || m.team2.includes('日本');
                const matchDate = getMatchDateTime(m.date, m.time);
                return isJapanMatch && matchDate >= now;
            });

            if (japanMatches.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>日本代表の試合はありません</p></div>';
                return;
            }

            container.innerHTML = '';
            container.appendChild(createMatchCard(japanMatches[0], true));
        }

        function renderSevenDaysPreview() {
            const container = document.getElementById('seven-days-preview-container');
            const now = new Date();
            const sevenDaysLater = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
            
            const matches = MATCHES.filter(m => {
                const matchDate = getMatchDateTime(m.date, m.time);
                return matchDate >= now && matchDate <= sevenDaysLater;
            }).slice(0, 3);

            if (matches.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>今後7日間の試合はありません</p></div>';
                return;
            }

            container.innerHTML = '';
            matches.forEach(match => {
                container.appendChild(createMatchCard(match));
            });
        }

        function renderSevenDaysFull() {
            const container = document.getElementById('seven-days-container');
            const now = new Date();
            const sevenDaysLater = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
            
            const matches = MATCHES.filter(m => {
                const matchDate = getMatchDateTime(m.date, m.time);
                return matchDate >= now && matchDate <= sevenDaysLater;
            });

            if (matches.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div><p>今後7日間の試合はありません</p></div>';
                return;
            }

            container.innerHTML = '';
            matches.forEach(match => {
                container.appendChild(createMatchCard(match));
            });
        }

        function renderAllMatches() {
            const container = document.getElementById('all-matches-container');
            const now = new Date();
            const matches = MATCHES.filter(m => {
                const matchDate = getMatchDateTime(m.date, m.time);
                return matchDate >= now;
            });

            if (matches.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🏆</div><p>表示する試合がありません</p></div>';
                return;
            }

            container.innerHTML = '';
            matches.forEach(match => {
                container.appendChild(createMatchCard(match));
            });
        }

        function renderStats() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const lastMatch = MATCHES[MATCHES.length - 1];
            const lastMatchDate = getMatchDateTime(lastMatch.date, lastMatch.time);

            const remainingMatches = MATCHES.filter(m => {
                const matchDate = getMatchDateTime(m.date, m.time);
                return matchDate >= today;
            }).length;

            const daysRemaining = Math.ceil((lastMatchDate - today) / (1000 * 60 * 60 * 24));

            document.getElementById('total-matches').textContent = remainingMatches;
            document.getElementById('days-remaining').textContent = daysRemaining;
        }

        function renderSearchFilters() {
            // Groups filter
            const groupFilter = document.getElementById('group-filter');
            const groups = [...new Set(MATCHES.filter(m => m.group !== '-').map(m => m.group))].sort();
            
            groupFilter.innerHTML = '<strong style="width: 100%; margin-bottom: 0.5rem; display: block; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;">グループ</strong>';
            
            groups.forEach(group => {
                const chip = document.createElement('button');
                chip.className = 'chip';
                chip.textContent = `グループ ${group}`;
                chip.dataset.filter = `group:${group}`;
                chip.onclick = () => filterSearch();
                groupFilter.appendChild(chip);
            });

            // City filter
            const cityFilter = document.getElementById('city-filter');
            const cities = [...new Set(MATCHES.map(m => m.location))].sort();
            
            cityFilter.innerHTML = '<strong style="width: 100%; margin-bottom: 0.5rem; display: block; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;">開催都市</strong>';
            
            cities.forEach(city => {
                const chip = document.createElement('button');
                chip.className = 'chip';
                chip.textContent = city;
                chip.dataset.filter = `city:${city}`;
                chip.onclick = () => filterSearch();
                cityFilter.appendChild(chip);
            });
        }

        function filterSearch() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const activeFilters = Array.from(document.querySelectorAll('.chip.active')).map(c => c.dataset.filter);
            const resultsContainer = document.getElementById('search-results-container');

            let results = MATCHES.filter(match => {
                const now = new Date();
                const matchDate = getMatchDateTime(match.date, match.time);
                if (matchDate < now) return false;

                let matchesSearch = true;
                if (searchText) {
                    const fullText = `${match.team1} ${match.team2} ${match.location} ${match.stage}`.toLowerCase();
                    matchesSearch = fullText.includes(searchText);
                }

                let matchesFilters = activeFilters.length === 0;
                if (!matchesFilters) {
                    matchesFilters = activeFilters.every(filter => {
                        const [type, value] = filter.split(':');
                        if (type === 'group') return match.group === value;
                        if (type === 'city') return match.location === value;
                        return false;
                    });
                }

                return matchesSearch && matchesFilters;
            });

            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><p>検索結果がありません</p></div>';
                return;
            }

            resultsContainer.innerHTML = '';
            results.forEach(match => {
                resultsContainer.appendChild(createMatchCard(match));
            });
        }

        // ==================== Event Listeners ====================
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                
                btn.classList.add('active');
                const tabId = btn.dataset.tab + '-tab';
                document.getElementById(tabId).classList.add('active');

                if (btn.dataset.tab === 'search') {
                    renderSearchFilters();
                } else if (btn.dataset.tab === 'seven-days') {
                    renderSevenDaysFull();
                } else if (btn.dataset.tab === 'all') {
                    renderAllMatches();
                }
            });
        });

        document.getElementById('search-button').addEventListener('click', filterSearch);
        document.getElementById('search-input').addEventListener('keyup', filterSearch);

        // ==================== Service Worker Registration ====================
        if ('serviceWorker' in navigator) {
            const swScript = `
                self.addEventListener('install', event => {
                    event.waitUntil(self.skipWaiting());
                });
                self.addEventListener('activate', event => {
                    event.waitUntil(self.clients.claim());
                });
                self.addEventListener('fetch', event => {
                    event.respondWith(fetch(event.request).catch(() => {
                        return new Response('Offline', { status: 503 });
                    }));
                });
            `;
            
            const blob = new Blob([swScript], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed:', err));
        }

        // ==================== PWA Install Prompt ====================
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredPrompt = event;
            document.getElementById('install-prompt').classList.add('show');
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                deferredPrompt = null;
                document.getElementById('install-prompt').classList.remove('show');
            }
        });

        document.getElementById('dismiss-btn').addEventListener('click', () => {
            document.getElementById('install-prompt').classList.remove('show');
        });

        // ==================== Auto-refresh & Time Update ====================
        function updateTime() {
            const now = new Date();
            document.getElementById('update-time').textContent = now.toLocaleString('ja-JP');
        }

        setInterval(() => {
            renderNextMatch();
            renderNextJapanMatch();
            renderStats();
            updateTime();
        }, 30000); // Update every 30 seconds

        // ==================== Initial Render ====================
        renderNextMatch();
        renderNextJapanMatch();
        renderSevenDaysPreview();
        renderStats();
        updateTime();
    </script>
