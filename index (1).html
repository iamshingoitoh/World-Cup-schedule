            { group: "J", team1: "🇩🇿 アルジェリア", team2: "🇦🇹 オーストリア", date: "2026-06-28", time: "11:00", location: "カンザスシティ" },
            { group: "J", team1: "🇯🇴 ヨルダン", team2: "🇦🇷 アルゼンチン", date: "2026-06-28", time: "11:00", location: "ダラス" },

            // グループK
            { group: "K", team1: "🇵🇹 ポルトガル", team2: "🇨🇩 コンゴ民主共和国", date: "2026-06-18", time: "02:00", location: "ヒューストン" },
            { group: "K", team1: "🇺🇿 ウズベキスタン", team2: "🇨🇴 コロンビア", date: "2026-06-18", time: "11:00", location: "メキシコシティ" },
            { group: "K", team1: "🇵🇹 ポルトガル", team2: "🇺🇿 ウズベキスタン", date: "2026-06-24", time: "02:00", location: "ヒューストン" },
            { group: "K", team1: "🇨🇴 コロンビア", team2: "🇨🇩 コンゴ民主共和国", date: "2026-06-24", time: "11:00", location: "グアダラハラ" },
            { group: "K", team1: "🇨🇴 コロンビア", team2: "🇵🇹 ポルトガル", date: "2026-06-28", time: "08:30", location: "マイアミ" },
            { group: "K", team1: "🇨🇩 コンゴ民主共和国", team2: "🇺🇿 ウズベキスタン", date: "2026-06-28", time: "08:30", location: "アトランタ" },

            // グループL
            { group: "L", team1: "🇬🇧 イングランド", team2: "🇭🇷 クロアチア", date: "2026-06-18", time: "05:00", location: "ダラス" },
            { group: "L", team1: "🇬🇭 ガーナ", team2: "🇵🇦 パナマ", date: "2026-06-18", time: "08:00", location: "トロント" },
            { group: "L", team1: "🇬🇧 イングランド", team2: "🇬🇭 ガーナ", date: "2026-06-24", time: "05:00", location: "ボストン" },
            { group: "L", team1: "🇵🇦 パナマ", team2: "🇭🇷 クロアチア", date: "2026-06-24", time: "08:00", location: "トロント" },
            { group: "L", team1: "🇵🇦 パナマ", team2: "🇬🇧 イングランド", date: "2026-06-28", time: "06:00", location: "ニューヨーク" },
            { group: "L", team1: "🇭🇷 クロアチア", team2: "🇬🇭 ガーナ", date: "2026-06-28", time: "06:00", location: "フィラデルフィア" },
        ];

        function getMatchDateTime(dateStr, timeStr) {
            const [year, month, day] = dateStr.split('-');
            const [hours, minutes] = timeStr.split(':');
            return new Date(year, parseInt(month) - 1, day, parseInt(hours), parseInt(minutes));
        }

        function formatDate(date) {
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const dayOfWeek = days[date.getDay()];
            return `${month}/${day}(${dayOfWeek})`;
        }

        function formatTime(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function isMatchCompleted(match) {
            const matchDate = getMatchDateTime(match.date, match.time);
            return matchDate < new Date();
        }

        function getCountdownText(match) {
            const matchDate = getMatchDateTime(match.date, match.time);
            const now = new Date();
            const diffMs = matchDate - now;

            if (diffMs < 0) return '試合終了';

            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            if (diffDays > 0) {
                return `あと${diffDays}日${diffHours}時間`;
            } else if (diffHours > 0) {
                return `あと${diffHours}時間`;
            } else {
                const diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                return `あと${diffMinutes}分`;
            }
        }

        function createMatchCard(match, highlight = false) {
            const matchDate = getMatchDateTime(match.date, match.time);
            const isCompleted = isMatchCompleted(match);

            const card = document.createElement('div');
            card.className = `card ${highlight ? 'highlight' : ''} ${isCompleted ? 'completed' : ''}`;
            
            card.innerHTML = `
                <div class="match-card">
                    <div class="match-team">
                        <div class="match-team-flag">${match.team1.split(' ')[0]}</div>
                        <div class="match-team-name">${match.team1.split(' ').slice(1).join(' ')}</div>
                    </div>
                    <div class="match-center">
                        <div class="match-date">${formatDate(matchDate)}</div>
                        <div class="match-time">${formatTime(matchDate)}</div>
                        <div class="match-stage">グループ${match.group}</div>
                        ${!isCompleted ? `<div class="match-countdown">${getCountdownText(match)}</div>` : ''}
                        <div class="match-location">${match.location}</div>
                    </div>
                    <div class="match-team">
                        <div class="match-team-flag">${match.team2.split(' ')[0]}</div>
                        <div class="match-team-name">${match.team2.split(' ').slice(1).join(' ')}</div>
                    </div>
                </div>
            `;

            return card;
        }

        function renderNextMatch() {
            const container = document.getElementById('next-match-container');
            const now = new Date();
            const upcoming = MATCHES.filter(m => getMatchDateTime(m.date, m.time) >= now);

            container.innerHTML = upcoming.length > 0 
                ? '' 
                : '<div class="empty-state"><div class="empty-state-icon">🎉</div><p>全試合終了！</p></div>';
            
            if (upcoming.length > 0) {
                container.appendChild(createMatchCard(upcoming[0], true));
            }
        }

        function renderNextJapanMatch() {
            const container = document.getElementById('next-japan-match-container');
            const now = new Date();
            const japan = MATCHES.filter(m => 
                (m.team1.includes('日本') || m.team2.includes('日本')) && 
                getMatchDateTime(m.date, m.time) >= now
            );

            container.innerHTML = japan.length > 0 
                ? '' 
                : '<div class="empty-state"><p>日本代表の試合はありません</p></div>';
            
            if (japan.length > 0) {
                container.appendChild(createMatchCard(japan[0], true));
            }
        }

        function renderSevenDaysPreview() {
            const container = document.getElementById('seven-days-preview-container');
            const now = new Date();
            const sevenDays = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
            
            const matches = MATCHES.filter(m => {
                const md = getMatchDateTime(m.date, m.time);
                return md >= now && md <= sevenDays;
            }).slice(0, 3);

            container.innerHTML = matches.length > 0 ? '' : '<div class="empty-state"><p>今後7日間の試合はありません</p></div>';
            matches.forEach(m => container.appendChild(createMatchCard(m)));
        }

        function renderSevenDaysFull() {
            const container = document.getElementById('seven-days-container');
            const now = new Date();
            const sevenDays = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
            
            const matches = MATCHES.filter(m => {
                const md = getMatchDateTime(m.date, m.time);
                return md >= now && md <= sevenDays;
            });

            container.innerHTML = matches.length > 0 ? '' : '<div class="empty-state"><div class="empty-state-icon">📅</div><p>今後7日間の試合がありません</p></div>';
            matches.forEach(m => container.appendChild(createMatchCard(m)));
        }

        function renderAllMatches() {
            const container = document.getElementById('all-matches-container');
            const now = new Date();
            const matches = MATCHES.filter(m => getMatchDateTime(m.date, m.time) >= now);

            container.innerHTML = matches.length > 0 ? '' : '<div class="empty-state"><div class="empty-state-icon">🏆</div><p>表示する試合がありません</p></div>';
            matches.forEach(m => container.appendChild(createMatchCard(m)));
        }

        function renderStats() {
            const now = new Date();
            const remaining = MATCHES.filter(m => getMatchDateTime(m.date, m.time) >= now).length;
            const lastMatch = MATCHES[MATCHES.length - 1];
            const lastDate = getMatchDateTime(lastMatch.date, lastMatch.time);
            const days = Math.ceil((lastDate - now) / (1000 * 60 * 60 * 24));

            document.getElementById('total-matches').textContent = remaining;
            document.getElementById('days-remaining').textContent = days;
        }

        function renderSearchFilters() {
            const container = document.getElementById('group-filter');
            const groups = [...new Set(MATCHES.map(m => m.group))].sort();
            
            container.innerHTML = '';
            groups.forEach(group => {
                const chip = document.createElement('button');
                chip.className = 'chip';
                chip.textContent = `グループ${group}`;
                chip.onclick = () => { chip.classList.toggle('active'); filterSearch(); };
                container.appendChild(chip);
            });
        }

        function filterSearch() {
            const text = document.getElementById('search-input').value.toLowerCase();
            const active = Array.from(document.querySelectorAll('.chip.active')).map(c => c.textContent);
            const results = document.getElementById('search-results-container');

            const matches = MATCHES.filter(m => {
                if (getMatchDateTime(m.date, m.time) < new Date()) return false;
                
                const fullText = `${m.team1} ${m.team2} ${m.location}`.toLowerCase();
                const matchText = !text || fullText.includes(text);
                const matchGroup = active.length === 0 || active.some(a => m.group === a.replace('グループ', ''));
                
                return matchText && matchGroup;
            });

            results.innerHTML = matches.length > 0 ? '' : '<div class="empty-state"><div class="empty-state-icon">🔍</div><p>検索結果がありません</p></div>';
            matches.forEach(m => results.appendChild(createMatchCard(m)));
        }

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                
                btn.classList.add('active');
                const tab = document.getElementById(btn.dataset.tab + '-tab');
                tab.classList.add('active');

                if (btn.dataset.tab === 'search') renderSearchFilters();
                else if (btn.dataset.tab === 'seven-days') renderSevenDaysFull();
                else if (btn.dataset.tab === 'all') renderAllMatches();
            });
        });

        document.getElementById('search-button').addEventListener('click', filterSearch);
        document.getElementById('search-input').addEventListener('keyup', filterSearch);

        setInterval(() => {
            renderNextMatch();
            renderNextJapanMatch();
            renderStats();
        }, 30000);

        renderNextMatch();
        renderNextJapanMatch();
        renderSevenDaysPreview();
        renderStats();
    </script>
</body>
